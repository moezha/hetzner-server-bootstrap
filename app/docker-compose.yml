version: '3.8'

services:
  app:
    build: ./app
    container_name: production_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5000}:${PORT:-5000}"
    environment:
      - PORT=${PORT:-5000}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"